name: Build MSMARCO-XI RAG Index

on:
  workflow_dispatch:
    inputs:
      config:
        description: "MSMARCO-XI language config"
        required: true
        default: "ta"
      max_docs:
        description: "Number of dataset rows to index"
        required: true
        default: "1000"

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install indexing dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt

      - name: Show build configuration
        run: |
          python --version
          python - <<'PY'
          import os
          import torch
          print(f"PyTorch: {torch.__version__}")
          print(f"Torch threads: {torch.get_num_threads()}")
          print(f"OMP_NUM_THREADS: {os.getenv('OMP_NUM_THREADS')}")
          print(f"MKL_NUM_THREADS: {os.getenv('MKL_NUM_THREADS')}")
          PY

      - name: Build index on GitHub runner
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/build_index.py \
            --config "${{ inputs.config }}" \
            --split train \
            --max-docs "${{ inputs.max_docs }}" \
            --batch-size 128 \
            --output artifacts/index

      - name: Upload index artifact
        uses: actions/upload-artifact@v6
        with:
          name: msmarco-xi-index-${{ inputs.config }}
          path: artifacts/index/
          if-no-files-found: error
          retention-days: 7
