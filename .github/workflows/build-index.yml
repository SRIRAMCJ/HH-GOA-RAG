name: Build MSMARCO-XI RAG Index

on:
  workflow_dispatch:
    inputs:
      config:
        description: "MSMARCO-XI language config"
        required: true
        default: "ta"
      max_docs:
        description: "Number of dataset rows to index"
        required: true
        default: "1000"

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install indexing dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt

      - name: Show build configuration
        run: |
          python --version
          python - <<'PY'
          import os
          import torch
          print(f"PyTorch: {torch.__version__}")
          print(f"Torch threads: {torch.get_num_threads()}")
          print(f"OMP_NUM_THREADS: {os.getenv('OMP_NUM_THREADS')}")
          print(f"MKL_NUM_THREADS: {os.getenv('MKL_NUM_THREADS')}")
          PY

      - name: Build index on GitHub runner
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/build_index.py \
            --config "${{ inputs.config }}" \
            --split train \
            --max-docs "${{ inputs.max_docs }}" \
            --batch-size 128 \
            --output artifacts/index

      - name: Validate generated RAG index
        working-directory: backend
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from app.retrieval.index_store import DenseIndex
          from app.retrieval.hybrid import HybridRetriever

          root = Path("../artifacts/index")
          required = ["vectors.faiss", "chunks.jsonl", "bm25_tokens.jsonl", "manifest.json"]
          for name in required:
              path = root / name
              if not path.exists():
                  raise RuntimeError(f"Missing index file: {name}")
              print(f"FOUND {name}: {path.stat().st_size:,} bytes")

          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          dense = DenseIndex.load(root)
          if dense is None:
              raise RuntimeError("DenseIndex.load() returned None")

          print(f"Manifest chunks: {manifest['chunks']}")
          print(f"FAISS vectors: {dense.index.ntotal}")
          print(f"Loaded chunks: {len(dense.chunks)}")
          print(f"FAISS dimension: {dense.index.d}")

          if dense.index.ntotal != len(dense.chunks):
              raise RuntimeError("FAISS/chunks count mismatch")
          if dense.index.ntotal != manifest["chunks"]:
              raise RuntimeError("Manifest/FAISS count mismatch")
          print("FAISS + chunks: PASS")

          retriever = HybridRetriever(dense.chunks, dense)
          query = " ".join(dense.chunks[0].text.split()[:12])
          lexical = retriever.lexical_search(query, top_k=5)
          if not lexical:
              raise RuntimeError("BM25 returned no results")
          print(f"BM25 results: {len(lexical)}")
          print("BM25: PASS")

          vector = np.asarray(dense.index.reconstruct(0), dtype="float32").reshape(1, -1)
          dense_results = retriever.dense_search(vector, top_k=5)
          if not dense_results:
              raise RuntimeError("FAISS returned no results")
          print(f"FAISS results: {len(dense_results)}")
          print("FAISS search: PASS")

          hybrid = retriever.fuse(dense_results, lexical, top_k=5)
          if not hybrid:
              raise RuntimeError("Hybrid RRF returned no results")
          print(f"Hybrid results: {len(hybrid)}")
          print("RRF hybrid: PASS")
          print("INDEX VALIDATION PASSED")
          PY

      - name: Upload index artifact
        uses: actions/upload-artifact@v6
        with:
          name: msmarco-xi-index-${{ inputs.config }}
          path: artifacts/index/
          if-no-files-found: error
          retention-days: 7
