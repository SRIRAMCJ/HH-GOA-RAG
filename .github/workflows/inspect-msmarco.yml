name: Inspect MSMARCO-XI

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dataset tooling
        run: |
          python -m pip install --upgrade pip
          pip install "datasets>=3.2,<5" "huggingface-hub>=0.28,<1"

      - name: Inspect dataset schema and samples
        run: python scripts/inspect_dataset.py --rows 3
